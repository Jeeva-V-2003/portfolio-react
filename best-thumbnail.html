<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }
    .card {
      background: #fff;
      width: 100%;
      height: 100%;
      border-radius: 30px;
      padding: 80px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    .accent {
      position: absolute;
      top: 0;
      right: 0;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border-radius: 50%;
      transform: translate(30%, -30%);
      opacity: 0.1;
    }
    .content {
      position: relative;
      z-index: 2;
    }
    .label {
      display: inline-block;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      padding: 10px 24px;
      border-radius: 25px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }
    .name {
      font-family: 'Sora', sans-serif;
      font-size: 100px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1;
      margin-bottom: 25px;
      letter-spacing: -2px;
    }
    .role {
      font-family: 'DM Sans', sans-serif;
      font-size: 38px;
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 50px;
    }
    .divider {
      width: 100px;
      height: 5px;
      background: linear-gradient(90deg, #f093fb, #f5576c);
      border-radius: 10px;
      margin-bottom: 50px;
    }
    .skills {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    .skill {
      font-family: 'DM Sans', sans-serif;
      background: #f8f8f8;
      border: 2px solid #e0e0e0;
      padding: 12px 26px;
      border-radius: 12px;
      color: #333;
      font-size: 17px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent"></div>
    <div class="content">
      <div class="label">Portfolio</div>
      <div class="name">JEEVA VINCENT</div>
      <div class="role">Data Engineer</div>
      <div class="divider"></div>
      <div class="skills">
        <div class="skill">Python</div>
        <div class="skill">Machine Learning</div>
        <div class="skill">Big Data</div>
        <div class="skill">PostgreSQL</div>
        <div class="skill">APIs</div>
        <div class="skill">ETL</div>
      </div>
    </div>
  </div>
</body>
</html>
