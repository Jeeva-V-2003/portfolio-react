<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Raleway:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(255, 255, 255, 0.08) 0%, transparent 40%);
    }
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 8px 20px;
      border-radius: 20px;
      color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .name {
      font-family: 'Montserrat', sans-serif;
      font-size: 120px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 20px;
      line-height: 1;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      letter-spacing: -3px;
    }
    .role {
      font-family: 'Raleway', sans-serif;
      font-size: 40px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 6px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .divider {
      width: 120px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #fbbf24, transparent);
      margin: 0 auto 50px;
    }
    .skills {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 900px;
      margin: 0 auto;
    }
    .skill {
      font-family: 'Raleway', sans-serif;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 10px 24px;
      border-radius: 25px;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .corner {
      position: absolute;
      width: 150px;
      height: 150px;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
    .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-br"></div>
  <div class="content">
    <div class="badge">PORTFOLIO</div>
    <div class="name">JEEVA VINCENT</div>
    <div class="role">Data Engineer</div>
    <div class="divider"></div>
    <div class="skills">
      <div class="skill">Python</div>
      <div class="skill">Machine Learning</div>
      <div class="skill">Big Data</div>
      <div class="skill">PostgreSQL</div>
      <div class="skill">APIs</div>
      <div class="skill">ETL</div>
    </div>
  </div>
</body>
</html>
